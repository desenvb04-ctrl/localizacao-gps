<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Registrar localização</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      font-family: Arial, sans-serif;

      background: #f5f7fa;
      color: #202124;
    }

    .card {
      width: 90%;
      max-width: 420px;

      background: white;

      padding: 35px 25px;

      border-radius: 18px;

      text-align: center;

      box-shadow:
        0 5px 25px rgba(0,0,0,0.12);
    }

    h1 {
      margin-top: 0;
      font-size: 25px;
    }

    p {
      color: #5f6368;
      line-height: 1.5;
    }

    button {

      width: 100%;

      margin-top: 20px;

      padding: 16px;

      border: none;

      border-radius: 10px;

      background: #1a73e8;

      color: white;

      font-size: 18px;

      font-weight: bold;

      cursor: pointer;

    }

    button:disabled {
      background: #9aa0a6;
      cursor: not-allowed;
    }

    #status {

      margin-top: 25px;

      font-size: 15px;

      line-height: 1.5;

    }

    .sucesso {
      color: #188038;
    }

    .erro {
      color: #d93025;
    }

  </style>

</head>


<body>

<div class="card">

  <h1>📍 Registrar localização</h1>

  <p>
    Clique no botão abaixo para registrar
    sua localização atual.
  </p>

  <button id="botao"
          onclick="registrar()">

    📍 ESTOU AQUI

  </button>

  <div id="status"></div>

</div>


<script>


const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbyO6RGWlbVHj0ppqUVTaw_QobOYFkOEFftmX01cKTJw1bL2Ikvie8vSxbR9W-AssOrQUQ/exec";


function registrar() {

  const botao =
    document.getElementById("botao");

  const status =
    document.getElementById("status");


  if (!navigator.geolocation) {

    status.innerHTML =
      "❌ Seu dispositivo não suporta geolocalização.";

    return;

  }


  botao.disabled = true;

  botao.innerText =
    "📡 Obtendo localização...";


  status.innerText =
    "Aguarde alguns segundos...";


  navigator.geolocation.getCurrentPosition(

    function(position) {

      const latitude =
        position.coords.latitude;

      const longitude =
        position.coords.longitude;

      const precisao =
        position.coords.accuracy;


      status.innerText =
        "📤 Registrando localização...";


      /*
       * Enviamos os dados através de uma imagem.
       * Isso evita o problema de CORS do Apps Script.
       */

      const url =
        URL_APPS_SCRIPT +
        "?latitude=" +
        encodeURIComponent(latitude) +
        "&longitude=" +
        encodeURIComponent(longitude) +
        "&precisao=" +
        encodeURIComponent(precisao);


      const imagem =
        new Image();


      imagem.onload = function() {

        status.className =
          "sucesso";

        status.innerHTML =
          "✅ <strong>Localização registrada!</strong><br><br>" +
          "Latitude: " +
          latitude.toFixed(6) +
          "<br>" +
          "Longitude: " +
          longitude.toFixed(6);

        botao.innerText =
          "✓ Registrado";

      };


      imagem.onerror = function() {

        /*
         * Mesmo que o navegador não consiga
         * interpretar a resposta do Apps Script,
         * a requisição pode ter sido recebida.
         */

        status.className =
          "sucesso";

        status.innerHTML =
          "✅ <strong>Localização enviada!</strong><br><br>" +
          "Latitude: " +
          latitude.toFixed(6) +
          "<br>" +
          "Longitude: " +
          longitude.toFixed(6);

        botao.innerText =
          "✓ Enviado";

      };


      imagem.src = url;

    },


    function(error) {

      botao.disabled = false;

      botao.innerText =
        "📍 Tentar novamente";

      status.className =
        "erro";


      if (error.code === 1) {

        status.innerHTML =
          "❌ <strong>Permissão negada.</strong><br>" +
          "Permita o acesso à localização.";

      }

      else if (error.code === 2) {

        status.innerHTML =
          "❌ Não foi possível determinar sua localização.";

      }

      else if (error.code === 3) {

        status.innerHTML =
          "⏱️ A localização demorou muito.";

      }

      else {

        status.innerHTML =
          "❌ Erro ao obter localização.";

      }

    },


    {
      enableHighAccuracy: true,
      timeout: 30000,
      maximumAge: 0
    }

  );

}

</script>

</body>

</html>
