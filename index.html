<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Registrar localização</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      font-family: Arial, sans-serif;

      background: #f5f7fa;
      color: #202124;
    }

    .card {
      width: 90%;
      max-width: 420px;

      background: white;

      padding: 35px 25px;

      border-radius: 18px;

      text-align: center;

      box-shadow: 0 5px 25px rgba(0,0,0,0.12);
    }

    h1 {
      margin-top: 0;
      font-size: 25px;
    }

    p {
      color: #5f6368;
      line-height: 1.5;
    }

    button {
      width: 100%;
      margin-top: 20px;

      padding: 16px;

      border: none;
      border-radius: 10px;

      background: #1a73e8;
      color: white;

      font-size: 18px;
      font-weight: bold;

      cursor: pointer;
    }

    button:disabled {
      background: #9aa0a6;
      cursor: not-allowed;
    }

    #status {
      margin-top: 25px;
      font-size: 15px;
      line-height: 1.5;
    }

    .sucesso {
      color: #188038;
    }

    .erro {
      color: #d93025;
    }

  </style>
</head>

<body>

<div class="card">

  <h1>📍 Registrar localização</h1>

  <p>
    Clique no botão abaixo para registrar
    sua localização atual.
  </p>

  <button id="botao" onclick="registrar()">
    📍 ESTOU AQUI
  </button>

  <div id="status"></div>

</div>


<script>

// ==================================================
// CONFIGURAÇÃO
// ==================================================

const URL_APPS_SCRIPT =
  "https://script.google.com/macros/s/AKfycbyhaSPYnrwNQr7jltwM9a7RUPtVYUdIMX9xU1Td4wEkjaeaSJ1kVBAMH7RpCwM26WnTSw/exec";


// ==================================================
// LÊ O CÓDIGO DA URL
// Exemplo:
// ?codigo=ABC001
// ==================================================

const parametros =
  new URLSearchParams(window.location.search);

const CODIGO =
  parametros.get("codigo");

let TOKEN = null;


// ==================================================
// OBTÉM TOKEN TEMPORÁRIO
// ==================================================

async function obterToken() {

  if (!CODIGO) {

    throw new Error(
      "Código do usuário não informado."
    );
  }

  const url =
    URL_APPS_SCRIPT +
    "?codigo=" +
    encodeURIComponent(CODIGO);

  const resposta =
    await fetch(url);

  const dados =
    await resposta.json();

  if (!dados.sucesso) {

    throw new Error(
      dados.mensagem ||
      "Não foi possível identificar o usuário."
    );
  }

  TOKEN =
    dados.token;

  return TOKEN;
}


// ==================================================
// REGISTRAR LOCALIZAÇÃO
// ==================================================

async function registrar() {

  const botao =
    document.getElementById("botao");

  const status =
    document.getElementById("status");


  // ----------------------------------------------
  // Verifica suporte à geolocalização
  // ----------------------------------------------

  if (!navigator.geolocation) {

    status.className = "erro";

    status.innerHTML =
      "❌ Seu dispositivo não suporta geolocalização.";

    return;
  }


  botao.disabled = true;

  botao.innerText =
    "📡 Obtendo localização...";


  status.className = "";

  status.innerText =
    "Aguarde alguns segundos...";


  // ----------------------------------------------
  // Obtém localização
  // ----------------------------------------------

  navigator.geolocation.getCurrentPosition(

    async function(position) {

      const latitude =
        position.coords.latitude;

      const longitude =
        position.coords.longitude;

      const precisao =
        position.coords.accuracy;


      // ------------------------------------------
      // Converte para texto
      // ------------------------------------------

      const latitudeTexto =
        String(latitude);

      const longitudeTexto =
        String(longitude);

      const precisaoTexto =
        String(precisao);


      // ------------------------------------------
      // Validação
      // ------------------------------------------

      if (
        latitude < -90 ||
        latitude > 90 ||
        longitude < -180 ||
        longitude > 180
      ) {

        status.className =
          "erro";

        status.innerHTML =
          "❌ A localização retornada é inválida.";

        botao.disabled = false;

        botao.innerText =
          "📍 Tentar novamente";

        return;
      }


      // ------------------------------------------
      // Identifica usuário e obtém token
      // ------------------------------------------

      status.innerText =
        "🔐 Identificando usuário...";


      try {

        await obterToken();

      } catch (erro) {

        botao.disabled = false;

        botao.innerText =
          "📍 Tentar novamente";

        status.className =
          "erro";

        status.innerHTML =
          "❌ " + erro.message;

        return;
      }


      // ------------------------------------------
      // Mostra localização
      // ------------------------------------------

      status.innerHTML =
        "📍 <strong>Localização encontrada</strong><br><br>" +
        "Latitude: " + latitudeTexto + "<br>" +
        "Longitude: " + longitudeTexto + "<br>" +
        "Precisão: " + precisaoTexto + " m<br><br>" +
        "📤 Registrando...";


      // ------------------------------------------
      // Monta URL
      // ------------------------------------------

      const url =
        URL_APPS_SCRIPT +
        "?token=" +
        encodeURIComponent(TOKEN) +
        "&latitude=" +
        encodeURIComponent(latitudeTexto) +
        "&longitude=" +
        encodeURIComponent(longitudeTexto) +
        "&precisao=" +
        encodeURIComponent(precisaoTexto);


      console.log(
        "URL enviada:",
        url
      );


      // ------------------------------------------
      // Envia para Apps Script
      // ------------------------------------------

      try {

        await fetch(url, {
          method: "GET",
          mode: "no-cors"
        });


        // ----------------------------------------
        // Sucesso
        // ----------------------------------------

        status.className =
          "sucesso";

        status.innerHTML =
          "✅ <strong>Localização registrada!</strong><br><br>" +
          "Latitude: " +
          latitude.toFixed(6) +
          "<br>" +
          "Longitude: " +
          longitude.toFixed(6) +
          "<br>" +
          "Precisão: " +
          precisao.toFixed(1) +
          " m";


        botao.innerText =
          "✓ Registrado";


        // ----------------------------------------
        // Botão voltar ao site
        // ----------------------------------------

        const voltar =
          document.createElement("button");


        voltar.innerText =
          "← Voltar ao site";


        voltar.style.marginTop =
          "15px";


        voltar.style.background =
          "#5f6368";


        voltar.onclick =
          function() {

            window.location.href =
              "https://sites.google.com/view/sitesouro/home";

          };


        status.appendChild(
          voltar
        );


      } catch (erro) {

        console.error(erro);

        status.className =
          "erro";

        status.innerHTML =
          "❌ Não foi possível enviar a localização.";

        botao.disabled = false;

        botao.innerText =
          "📍 Tentar novamente";
      }

    },


    // --------------------------------------------
    // ERRO DO GPS
    // --------------------------------------------

    function(error) {

      botao.disabled = false;

      botao.innerText =
        "📍 Tentar novamente";

      status.className =
        "erro";


      if (error.code === 1) {

        status.innerHTML =
          "❌ <strong>Permissão negada.</strong><br>" +
          "Permita o acesso à localização.";

      }

      else if (error.code === 2) {

        status.innerHTML =
          "❌ Não foi possível determinar sua localização.";

      }

      else if (error.code === 3) {

        status.innerHTML =
          "⏱️ A localização demorou muito.";

      }

      else {

        status.innerHTML =
          "❌ Erro ao obter localização.";

      }

    },


    // --------------------------------------------
    // CONFIGURAÇÕES DO GPS
    // --------------------------------------------

    {
      enableHighAccuracy: true,
      timeout: 30000,
      maximumAge: 0
    }

  );

}

</script>

</body>

</html>
